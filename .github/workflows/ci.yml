name: 持续集成

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 代码检查与构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
