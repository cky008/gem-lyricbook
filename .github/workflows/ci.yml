name: 持续集成

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与项目验证
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: JavaScript 语法检查
        run: npm run lint

      - name: 运行单元测试
        run: npm run test

      - name: 验证曲目数据与隐私规则
        run: npm run verify

  build:
    name: 构建验证
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建生产版本
        run: npm run build
