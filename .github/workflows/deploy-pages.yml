name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查、测试并构建
        run: npm run check

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 发布站点
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
